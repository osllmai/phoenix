name: phoenix
description: "Phoenix — local LLM app (Flutter UI over llama.cpp). Desktop-first, mobile companion."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Pure-Dart core: engine + chat/model services + persistence. UI owns no logic.
  phoenix_core:
    path: ../packages/phoenix_core

  # State · routing · HTTP (locked house stack; Riverpod 3 + codegen).
  flutter_riverpod: ^3.0.0
  riverpod_annotation: ^4.0.3
  go_router: ^17.3.0
  dio: ^5.9.0
  web_socket_channel: ^3.0.3
  device_info_plus: ^11.3.0
  package_info_plus: ^8.1.2
  google_fonts: ^6.2.1

  # Persistence (chat history, models).
  sqflite: ^2.3.0
  sqflite_common: ^2.5.0
  sqflite_common_ffi: ^2.3.0
  path: ^1.9.0
  path_provider: ^2.1.4
  shared_preferences: ^2.5.5
  # flutter_secure_storage deferred until API-key storage is wired (Linux build
  # needs the libsecret-1 system dev libs).

  # UI foundation.
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.3.0
  uuid: ^4.5.3
  intl: ^0.20.2

  # Chat: streaming LLM markdown + code highlighting.
  gpt_markdown: ^1.1.7
  markdown: ^7.3.1
  re_highlight: ^0.0.3

  # Models: import + resumable multi-GB GGUF downloads + thumbnails.
  file_selector: ^1.0.3
  desktop_drop: ^0.7.1
  background_downloader: ^9.5.5
  cached_network_image: ^3.4.1
  crypto: ^3.0.6

  # Speech (Whisper): capture + permissions (mic). Playback (audioplayers) is
  # deferred until the speech feature wires audio — its Linux build needs the
  # gstreamer-1.0 system dev libs.
  record: ^7.1.0
  permission_handler: ^12.0.3

  # Documents / DeepSearch: open links + files (preview reuses gpt_markdown).
  url_launcher: ^6.3.2
  open_filex: ^4.7.0

  # Desktop shell + developer terminal (PTY). Deferred until wired — window_manager
  # /tray_manager/xterm/flutter_pty are unused so far, and tray_manager's Linux
  # build needs ayatana-appindicator3 system libs.
  fl_chart: ^1.2.0
  smooth_page_indicator: ^2.0.1

  # Codegen annotations (generators are in dev_dependencies).
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  test: ^1.25.0
  flutter_lints: ^6.0.0

  # Codegen: immutable models + JSON + Riverpod providers.
  build_runner: ^2.15.0
  freezed: ^3.2.5
  json_serializable: ^6.14.0
  riverpod_generator: ^4.0.4

  # Launcher icon generator.
  flutter_launcher_icons: ^0.14.4

  # Testing: mocks · goldens · E2E (Patrol, locked).
  mocktail: ^1.0.5
  alchemist: ^0.14.0
  patrol: ^4.6.1

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/phoenix.svg
    - assets/logos/
    - assets/catalog/
    - assets/catalog/offline_models/
    - assets/catalog/online_models/

  fonts:
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans-Regular.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: Lora
      fonts:
        - asset: assets/fonts/Lora-Regular.ttf
        - asset: assets/fonts/Lora-Bold.ttf
          weight: 700
    - family: Merriweather
      fonts:
        - asset: assets/fonts/Merriweather-Regular.ttf
        - asset: assets/fonts/Merriweather-Bold.ttf
          weight: 700
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay-Regular.ttf
        - asset: assets/fonts/PlayfairDisplay-Bold.ttf
          weight: 700
    - family: OpenDyslexic
      fonts:
        - asset: assets/fonts/OpenDyslexic-Regular.ttf
        - asset: assets/fonts/OpenDyslexic-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/launcher/icon.png"
  adaptive_icon_background: "#17120E"
  adaptive_icon_foreground: "assets/launcher/icon_foreground.png"
  min_sdk_android: 21
