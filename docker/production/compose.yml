# Phoenix production app stack — gunicorn, built frontend image, DEBUG off.
# Edge reverse-proxy lives in nginx.yml; `make up-prod` layers both.
# DB/redis stay internal (no host ports). Own project name so it never clashes with the local stack.
name: phoenix-prod

services:
  django:
    image: phoenix-backend:current
    build: { context: ../../backend, dockerfile: ../docker/Dockerfile.backend }
    command: gunicorn config.wsgi:application --bind 0.0.0.0:16000 --workers 3
    env_file: ../../.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    expose: ['16000']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:16000/api/v1/health/']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: always

  celery:
    image: phoenix-backend:current
    build: { context: ../../backend, dockerfile: ../docker/Dockerfile.backend }
    command: celery -A config worker -l info -Q default,lowprio
    env_file: ../../.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck: { disable: true }
    restart: always

  frontend:
    image: phoenix-frontend:current
    build:
      context: ../../frontend
      dockerfile: ../docker/Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    env_file: ../../.env
    expose: ['3000']
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: always

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  redis:
    image: redis:7-alpine
    volumes: ['redisdata:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  prometheus:
    profiles: ['observability']
    image: prom/prometheus:v3.1.0
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    volumes:
      - ../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    expose: ['9090']
    restart: always

  victorialogs:
    profiles: ['observability']
    image: victoriametrics/victoria-logs:v1.0.0-victorialogs
    command: ['-storageDataPath=/vlogs']
    volumes: ['vlogsdata:/vlogs']
    expose: ['9428']
    restart: always

  grafana:
    profiles: ['observability']
    image: grafana/grafana:11.5.1
    environment:
      GF_INSTALL_PLUGINS: victoriametrics-logs-datasource
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - ../observability/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - grafanadata:/var/lib/grafana
    ports: ['${GRAFANA_PORT}:3000']
    depends_on: [prometheus, victorialogs]
    restart: always

  celery-exporter:
    profiles: ['observability']
    image: danihodovic/celery-exporter:0.12.0
    command: ['--broker-url=${CELERY_BROKER_URL}']
    expose: ['9808']
    depends_on:
      redis: { condition: service_healthy }
    restart: always

volumes:
  pgdata:
  redisdata:
  promdata:
  vlogsdata:
  grafanadata:
