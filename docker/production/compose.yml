# Phoenix production app stack — gunicorn, built frontend image, DEBUG off.
# Edge reverse-proxy lives in nginx.yml; `make up-prod` layers both.
# DB/redis stay internal (no host ports). Own project name so it never clashes with the local stack.
name: phoenix-prod

services:
  backend:
    image: phoenix-backend
    build: { context: ../../backend, dockerfile: ../docker/Dockerfile.backend }
    command: gunicorn config.wsgi:application --bind 0.0.0.0:16000 --workers 3
    env_file: ../../.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    expose: ['16000']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:16000/api/v1/health/']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: always

  celery:
    image: phoenix-backend
    build: { context: ../../backend, dockerfile: ../docker/Dockerfile.backend }
    command: celery -A config worker -l info
    env_file: ../../.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck: { disable: true }
    restart: always

  frontend:
    image: phoenix-frontend
    build: { context: ../../frontend, dockerfile: ../docker/Dockerfile.frontend }
    env_file: ../../.env
    expose: ['3000']
    restart: always

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  redis:
    image: redis:7-alpine
    volumes: ['redisdata:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

volumes:
  pgdata:
  redisdata:
