# Phoenix local stack (dev). `make up` targets this file.
name: phoenix

services:
  django:
    container_name: phoenix-django
    image: phoenix-backend
    build: { context: ../../backend, dockerfile: ../docker/Dockerfile.backend }
    command: python manage.py runserver 0.0.0.0:16000
    env_file: ../../.env
    ports: ['${API_PORT}:16000']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:16000/api/v1/health/']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  worker-cpu:
    container_name: phoenix-worker-cpu
    image: phoenix-backend
    build: { context: ../../backend, dockerfile: ../docker/Dockerfile.backend }
    command: celery -A config worker -l info -Q default
    env_file: ../../.env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck: { disable: true }
    restart: unless-stopped

  worker-lowprio:
    container_name: phoenix-worker-lowprio
    image: phoenix-backend
    build: { context: ../../backend, dockerfile: ../docker/Dockerfile.backend }
    command: celery -A config worker -l info -Q lowprio
    env_file: ../../.env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck: { disable: true }
    restart: unless-stopped

  frontend:
    container_name: phoenix-frontend
    image: node:22
    working_dir: /app
    command: sh -c "corepack enable && pnpm install && pnpm dev"
    env_file: ../../.env
    volumes:
      - ../../frontend:/app
      - /app/node_modules
      - /app/.next
      - /app/.pnpm-store
    ports: ['${WEB_PORT}:3000']
    restart: unless-stopped

  postgres:
    container_name: phoenix-postgres
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports: ['${PG_PORT}:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 180s
    restart: unless-stopped

  redis:
    container_name: phoenix-redis
    image: redis:7-alpine
    ports: ['${REDIS_PORT}:6379']
    volumes: ['redisdata:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  prometheus:
    profiles: ['observability']
    container_name: phoenix-prometheus
    image: prom/prometheus:v3.1.0
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    volumes:
      - ../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports: ['${PROMETHEUS_PORT}:9090']
    restart: unless-stopped

  victorialogs:
    profiles: ['observability']
    container_name: phoenix-victorialogs
    image: victoriametrics/victoria-logs:v1.0.0-victorialogs
    command: ['-storageDataPath=/vlogs']
    volumes: ['vlogsdata:/vlogs']
    ports: ['${VICTORIALOGS_PORT}:9428']
    restart: unless-stopped

  grafana:
    profiles: ['observability']
    container_name: phoenix-grafana
    image: grafana/grafana:11.5.1
    environment:
      GF_INSTALL_PLUGINS: victoriametrics-logs-datasource
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - ../observability/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - grafanadata:/var/lib/grafana
    ports: ['${GRAFANA_PORT}:3000']
    depends_on: [prometheus, victorialogs]
    restart: unless-stopped

  celery-exporter:
    profiles: ['observability']
    container_name: phoenix-celery-exporter
    image: danihodovic/celery-exporter:0.12.0
    command: ['--broker-url=${CELERY_BROKER_URL}']
    ports: ['${CELERY_EXPORTER_PORT}:9808']
    depends_on:
      redis: { condition: service_healthy }
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  promdata:
  vlogsdata:
  grafanadata:
