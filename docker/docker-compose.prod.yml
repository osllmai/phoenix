# Phoenix production stack — nginx entrypoint, gunicorn, DEBUG off.
# Run via `make up-prod` (pins --env-file .env). DB/redis stay internal (no host ports).
services:
  nginx:
    image: nginx:alpine
    ports: ['${HTTP_PORT}:80']
    volumes: ['./nginx:/etc/nginx/conf.d:ro']
    depends_on: [django, frontend]

  django:
    build: { context: ../backend, dockerfile: ../docker/Dockerfile }
    command: gunicorn config.wsgi:application --bind 0.0.0.0:16000
    env_file: ../.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    expose: ['16000']
    depends_on: [postgres, redis]

  celery:
    build: { context: ../backend, dockerfile: ../docker/Dockerfile }
    command: celery -A config worker -l info
    env_file: ../.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    depends_on: [redis, postgres]

  frontend:
    image: node:22
    working_dir: /app
    command: sh -c "corepack enable && pnpm install && pnpm build && pnpm start"
    volumes: ['../frontend:/app']
    expose: ['3000']

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

  redis:
    image: redis:7
