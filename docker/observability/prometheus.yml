global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # Celery task metrics (sent/started/succeeded/failed/runtime, per queue).
  # Task arguments are never exposed — that is why this replaced flower.
  - job_name: celery
    static_configs:
      - targets: ['celery-exporter:9808']
