<!doctype html>
<!-- design/mock/<viewport>/<app>/<prefix><screen>.html — copy per screen. CSS-var tokens only, no hex. -->
<!-- Dark theme + sensory minimalism. MUST render every state: empty/loading/first-run/success/error/denied. -->
<!-- Var names come from design/pattern/generated/tokens.mock.css (see emit_css.py): --bg-*, --surface-*, --text-*, --sp-*, --r-*, --font-*. -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SCREEN — STATE</title>
<link rel="stylesheet" href="../../../pattern/generated/tokens.mock.css" />
<style>
  body { margin:0; background:var(--bg-primary); color:var(--text-primary);
         font-family:var(--font-body); font-size:var(--fs-base); line-height:var(--lh-normal); }
  .screen { max-width:640px; margin:0 auto; padding:var(--sp-4); }
  .card { background:var(--surface-card); border:1px solid var(--border-subtle);
          border-radius:var(--r-md); padding:var(--sp-4); box-shadow:var(--shadow-sm); }
  .muted { color:var(--text-tertiary); }
  .accent { color:var(--accent-primary); }
  .state { display:none; }            /* toggle one state on at a time */
  .state[data-on] { display:block; }
  .skeleton { height:14px; border-radius:var(--r-sm); background:var(--bg-tertiary);
              animation:pulse var(--dur-gentle) var(--ease-default) infinite; }
  @keyframes pulse { 50% { opacity:.5; } }
</style>
</head>
<body>
  <main class="screen">
    <!-- SUCCESS / loaded -->
    <section class="state" data-state="success" data-on>
      <div class="card"><!-- populated data --></div>
    </section>
    <!-- EMPTY (valid request, zero records) -->
    <section class="state" data-state="empty">
      <div class="card muted">Nothing here yet.</div>
    </section>
    <!-- FIRST-RUN (user has done nothing — zero-state + onboarding CTA) -->
    <section class="state" data-state="first-run">
      <div class="card">Get started — <button class="accent">Add your first…</button></div>
    </section>
    <!-- LOADING (skeletons, no layout jank) -->
    <section class="state" data-state="loading">
      <div class="card"><div class="skeleton"></div></div>
    </section>
    <!-- ERROR (with retry) -->
    <section class="state" data-state="error">
      <div class="card">Couldn’t load. <button>Retry</button></div>
    </section>
    <!-- PERMISSION-DENIED (403 — never blank/crash, not retried) -->
    <section class="state" data-state="denied">
      <div class="card muted">You don’t have access to this.</div>
    </section>
  </main>
</body>
</html>
