[project]
name = "phoenix-backend"
version = "0.1.0"
description = "Phoenix backend — Django + django-ninja + Celery (mirrors health stack)"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.0,<5.2",
    "django-ninja>=1.3",
    # Docs UI is Scalar, never django-ninja's bundled Swagger (rules/workflow.md → Stack).
    "scalar-ninja==0.3.0",
    # Canonical auth core — allauth headless (owns hashing/sessions/verify/reset/MFA;
    # no hand-rolled auth, no paid SaaS). [mfa] pulls qrcode+fido2.
    "django-allauth[mfa,socialaccount]>=65.18,<66.0",
    "argon2-cffi>=23.1",
    # Canonical back-office admin — one shared unfold.admin.ModelAdmin base.
    "django-unfold>=0.96,<1.0",
    "celery>=5.4",
    "redis>=5.0",
    "psycopg[binary]>=3.2",
    "django-environ>=0.11",
    "gunicorn>=23.0",
    "pytest>=8.0",
    "pytest-django>=4.8",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "locust>=2.31",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# The image COPYs the source; this project is installed for its dependencies only.
py-modules = []

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.local"
testpaths = ["apps"]
python_files = ["test_*.py"]
markers = [
    "mock: external I/O stubbed; no network",
    "real: runs against the live Docker stack",
    "scenario(doc): the design/scenario doc this test executes",
    "quarantine(since, reason): known-flaky; expires",
    "unit: fast, no live stack; run on every push",
    "integration: needs the live stack or DB round-trips; run on merge",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "S", "BLE", "EXE", "RUF"]
ignore = [
    "E501",
    "RUF012",
    "S101",
]

[tool.ruff.lint.per-file-ignores]
# Test-only patterns: fixture credentials, a loopback bind constant, urlopen against a
# fixture URL, a deliberate broad except while probing settings, en dashes in prose.
"conftest.py" = ["S105", "S106"]
"*/tests/*" = ["S104", "S105", "S106", "S112", "S310", "BLE001", "RUF002"]
"tests/*" = ["S104", "S105", "S106", "S112", "S310", "BLE001", "RUF002"]
"loadtest/*" = ["S110", "S311", "BLE001"]
