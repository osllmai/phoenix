name: phoenix_server
description: >
  OpenAI- and Anthropic-compatible local HTTP gateway over phoenix_core, so any
  UI/CLI (incl. Claude Code) can use on-device GGUF models over HTTP.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.5.0

dependencies:
  phoenix_core:
    path: ../phoenix_core
  shelf: ^1.4.0
  shelf_router: ^1.1.4
  sqflite_common_ffi: ^2.3.0

dev_dependencies:
  test: ^1.25.0
  lints: ^4.0.0
